<script>
const botoes = document.querySelectorAll(".opcao");

botoes.forEach(botao => {
  botao.addEventListener("click", () => {
    // Desativa todos os botões
    botoes.forEach(b => {
      b.classList.remove("ativo");
      b.querySelector("img").src = "img/square.svg"; // volta para quadrado
      b.querySelector("img").alt = "quadrado";
    });

    // Ativa apenas o clicado
    botao.classList.add("ativo");
    botao.querySelector("img").src = "img/check-square.svg"; // muda para check
    botao.querySelector("img").alt = "check";
  });
});
</script>
